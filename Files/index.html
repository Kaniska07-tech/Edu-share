<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Authenticator - Secure Access with Firebase Authentication">
  <title>Authenticator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="auth-container">
      <!-- Header Section -->
      <header class="auth-header">
    <h1>Sign In/Up</h1>
       
      </header>

      <!-- Google Sign-In Section -->
      <section class="auth-section">
         <p class="subtitle">Secure access with Firebase authentication</p>
        <button id="googleSignInBtn" class="btn btn-google">
          <span class="btn-icon">🔒</span>
          Sign in with Google
        </button>
      </section>

      <!-- 
      <section id="userInfo" class="auth-section hidden">
        <h2>Welcome!</h2>
        <div class="user-details">
          <p><strong>Name:</strong> <span id="userName">-</span></p>
          <p><strong>Email:</strong> <span id="userEmail">-</span></p>
          <p><strong>Token:</strong> <span id="userToken" class="token-display">-</span></p>
        </div>
        <button id="signOutBtn" class="btn btn-secondary">Sign Out</button>
      </section>-->

      <!-- Message Display -->
      <div id="message" class="message" role="alert"></div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p><small>Powered by Firebase Authentication</small></p>
      </footer>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="js/authentictn.js"></script>
</body>
</html>
